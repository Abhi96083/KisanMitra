{% extends 'layout.html' %} {% block body %}

<style>
  .plant-body {
  background: linear-gradient(135deg, #f1fff1, #ffffff);
  color: #145a32;
  font-family: 'Calibri', sans-serif;
}

.plant-heading {
  text-align: center;
  color: #0a7a34;
  font-size: 2rem;
  font-weight: bold;
}

.plant-container {
  width: 500px;
  margin: 0 auto;
  background-color: #ffffff;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
}

.plant-form-title {
  color: #0a7a34;
  text-align: center;
  font-weight: bold;
}

.plant-file-input {
  background-color: #f6fff6;
  border: 1px solid #a4c3b2;
  color: #1d3b2f;
  font-weight: bold;
}

.plant-submit-btn {
  background: #0a7a34;
  color: white;
  border-radius: 6px;
  padding: 10px;
  font-size: 16px;
  font-weight: bold;
  transition: 0.3s;
}

.plant-submit-btn:hover {
  background: #12843c;
}

</style>

<div class="plant-body">
  <br /><br />
  <h2 class="plant-heading">
    {{ translations.disease.title }}
  </h2>
  <br /><br />

  <div class="plant-container">
    <form class="form-signin" method=post enctype=multipart/form-data>
      <h2 class="plant-form-title">{{ translations.disease.image_info }}</h2>
      <input type="file" name="file" class="plant-file-input" id="inputfile" onchange="preview_image(event)">
      <br>
      <br>
      <img id="output-image" class="plant-preview-image" />
      <button class="plant-submit-btn" type="submit">{{ translations.disease.submit }}</button>
    </form>
  </div>

  <script type="text/javascript">
    function preview_image(event) {
      var reader = new FileReader();
      reader.onload = function () {
        var output = document.getElementById('output-image')
        output.src = reader.result;
      }
      reader.readAsDataURL(event.target.files[0]);
    }
  </script>
</div>
{% endblock %}
