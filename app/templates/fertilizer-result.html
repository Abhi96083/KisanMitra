{% extends 'layout.html' %} {% block body %}
<style>
  .farm-card {
  background-color: #ffffff;
  border: 1px solid #cce8d3;
  border-radius: 12px;
  padding: 2rem;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
}

.farm-prediction {
  color: #0a7a34;
  font-size: 22px;
  font-weight: bold;
}

</style>

<div class="container py-2 farm-container">
  <div class="row">
    <div class="col-sm py-2 py-md-3">
      <div class="farm-card">
        <p class="text-center farm-prediction">{{ recommendation }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
