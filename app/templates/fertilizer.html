{% extends 'layout.html' %} {% block body %}

<style>
  .soil-body {
  background: linear-gradient(135deg, #f1fff7, #ffffff);
  color: #1d3b2f;
  padding: 3rem 0;
}

.soil-heading {
  color: #0a7a34;
  font-weight: bold;
  text-align: center;
  margin-bottom: 2rem;
}

.soil-container {
  background: #ffffff;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
  padding: 2.5rem;
  max-width: 600px;
  margin: 0 auto;
}

.soil-form-group {
  margin-bottom: 1.5rem;
}

.soil-label {
  color: #000000;
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
}

.soil-input, .soil-select {
  background: #f6fff6;
  border: 2px solid #a4c3b2;
  color: #000000;
  font-weight: bold;
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 1rem;
  transition: 0.3s;
}

.soil-input:focus, .soil-select:focus {
  outline: none;
  border-color: #0a7a34;
  background: #ffffff;
  box-shadow: 0 0 8px rgba(10, 122, 52, 0.2);
}

.soil-button-container {
  text-align: center;
  margin-top: 2rem;
}

.soil-submit-btn {
  background: linear-gradient(135deg, #0a7a34, #145a32);
  color: #ffffff;
  border: none;
  border-radius: 10px;
  padding: 12px 40px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 4px 15px rgba(10, 122, 52, 0.3);
}

.soil-submit-btn:hover {
  background: linear-gradient(135deg, #12843c, #1d7a47);
  box-shadow: 0 6px 20px rgba(10, 122, 52, 0.4);
  transform: translateY(-2px);
}

</style>

<div class="soil-body">
  <br /><br />
  <h2 class="soil-heading">
    {{ translations.fertilizer.title }}
  </h2>
  <br />

  <div class="soil-container">
    <form method="POST" action="{{ url_for('fert_recommend') }}">
      <div class="soil-form-group">
        <label for="Nitrogen" class="soil-label">{{ translations.fertilizer.nitrogen }}</label>
        <input type="number" class="soil-input" id="Nitrogen" name="nitrogen" placeholder="{{ translations.fertilizer.enter_value }}"
          required />
      </div>

      <div class="soil-form-group">
        <label for="Phosphorous" class="soil-label">{{ translations.fertilizer.phosphorous }}</label>
        <input type="number" class="soil-input" id="Phosphorous" name="phosphorous"
          placeholder="{{ translations.fertilizer.enter_value }}" required />
      </div>

      <div class="soil-form-group">
        <label for="Pottasium" class="soil-label">{{ translations.fertilizer.pottasium }}</label>
        <input type="number" class="soil-input" id="Pottasium" name="pottasium"
          placeholder="{{ translations.fertilizer.enter_value }}" required />
      </div>

      <div class="soil-form-group">
        <label for="crop" class="soil-label">{{ translations.fertilizer.crop }}</label>
        <select name="cropname" class="soil-select" id="crop" required>
          <option selected>{{ translations.fertilizer.select_crop }}</option>
          <option>rice</option>
          <option>maize</option>
          <option>chickpea</option>
          <option>kidneybeans</option>
          <option>pigeonpeas</option>
          <option>mothbeans</option>
          <option>mungbean</option>
          <option>blackgram</option>
          <option>lentil</option>
          <option>pomegranate</option>
          <option>banana</option>
          <option>mango</option>
          <option>grapes</option>
          <option>watermelon</option>
          <option>muskmelon</option>
          <option>apple</option>
          <option>orange</option>
          <option>papaya</option>
          <option>coconut</option>
          <option>cotton</option>
          <option>jute</option>
          <option>coffee</option>
        </select>
      </div>

      <div class="soil-button-container">
        <button type="submit" class="soil-submit-btn">
          {{ translations.fertilizer.predict }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
