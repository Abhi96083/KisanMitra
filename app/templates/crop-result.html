{% extends 'layout.html' %} {% block body %}

<style>
  .farm-prediction-container {
  margin: 8rem auto;
  padding: 2rem;
  max-width: 900px;
}

.farm-prediction-card {
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  padding: 3rem 2rem;
  border: 1px solid #cce8d3;
}

.farm-prediction-title {
  color: #145a32;
  font-size: 2.2rem;
  font-weight: 700;
  text-align: center;
}

.farm-prediction-highlight {
  color: #1ea44a;
  font-weight: bold;
  animation: pulse 2s infinite;
}

</style>

<div class="farm-prediction-container">
  <div class="farm-prediction-card">
    <h1 class="farm-prediction-title">
      <b>You should grow <i class="farm-prediction-highlight">{{ prediction }}</i> in your farm</b>
    </h1>
  </div>
</div>
{% endblock %}
